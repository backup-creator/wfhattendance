<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>WFH Attendance</title>
<style>
:root{font-family:Inter,system-ui,-apple-system,Segoe UI,sans-serif;color:#17263b;background:#f3f6fb}*{box-sizing:border-box}body{margin:0}header{background:#142d4a;color:white;padding:20px max(18px,calc((100vw - 1100px)/2));display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}header h1{font-size:20px;margin:0}header p{margin:4px 0 0;color:#c8d6e8;font-size:12px}main{max-width:1100px;margin:26px auto;padding:0 18px}.card{background:white;border:1px solid #e2e9f2;border-radius:15px;padding:22px;margin-bottom:17px;box-shadow:0 4px 18px #20395508}.narrow{max-width:650px;margin:35px auto}.grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.stat{background:#f4f7fc;padding:14px;border-radius:10px}.stat strong{display:block;font-size:23px}.muted{color:#738198;font-size:13px}h2{margin:0 0 6px;font-size:25px}h3{margin:0 0 15px;font-size:16px}form{display:grid;gap:12px}label{font-size:12px;font-weight:700;color:#4d5d73;display:grid;gap:6px}input,select,textarea{width:100%;border:1px solid #d7e1ee;border-radius:9px;padding:11px;font:inherit;background:#fff;color:#17263b}textarea{min-height:84px;resize:vertical}button{border:0;border-radius:9px;padding:10px 14px;font:inherit;font-size:13px;font-weight:700;cursor:pointer}.primary{background:#286fe8;color:white}.secondary{background:#edf2f8;color:#34465d}.danger{background:#fff0ed;color:#b53b2e}.actions{display:flex;gap:8px;flex-wrap:wrap}.badge{background:#eaf2ff;color:#245bb3;padding:5px 8px;border-radius:6px;font-size:11px;font-weight:700}.notice{padding:12px;border-radius:9px;background:#fff7e5;color:#75541b;font-size:12px;margin-top:12px}.message{padding:11px;border-radius:8px;margin:12px 0;background:#e9f8ef;color:#17683d;font-size:13px}.message.error{background:#fff0ed;color:#9e3025}.tabs{display:flex;gap:8px;flex-wrap:wrap;margin:18px 0}.tabs button.active{background:#142d4a;color:white}.tablewrap{overflow:auto}table{border-collapse:collapse;width:100%;min-width:650px}th,td{text-align:left;padding:12px;border-bottom:1px solid #edf1f6;font-size:12px;vertical-align:top}th{font-size:10px;text-transform:uppercase;letter-spacing:.05em;color:#7b899c}td textarea{min-width:180px;min-height:55px}footer{text-align:center;color:#8896a8;padding:18px;font-size:12px}.hidden{display:none!important}@media(max-width:720px){.grid{grid-template-columns:1fr}.stats{grid-template-columns:1fr 1fr 1fr}main{margin:16px auto;padding:0 12px}.card{padding:16px}}
</style></head><body><header><div><h1>WFH Attendance</h1><p>Remote work attendance and daily accomplishments</p></div><div id="who" class="muted"></div></header><main><div id="app"><section class="card narrow"><h2>Loading…</h2></section></div></main><footer>WFH Attendance · Cloudflare Workers + D1</footer>
<script>
const app=document.getElementById('app');let me=null,records=[],users=[],reports=[];
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const today=()=>new Date().toISOString().slice(0,10);
async function api(path,opts={}){const r=await fetch(path,{...opts,headers:{'Content-Type':'application/json',...(opts.headers||{})}});const b=await r.json().catch(()=>({error:'Unexpected response'}));if(!r.ok)throw Error(b.error||'Request failed');return b}
const post=(path,body)=>api(path,{method:'POST',body:JSON.stringify(body)});
function msg(s,error=false){return '<div class="message '+(error?'error':'')+'">'+esc(s)+'</div>'}
function formInput(label,name,type='text',extra=''){return '<label>'+label+'<input name="'+name+'" type="'+type+'" '+extra+' required></label>'}
async function boot(){try{const s=await api('/api/setup-status');if(s.setupRequired)return setup();try{const r=await api('/api/me');me=r.user;document.getElementById('who').textContent=me.name+' · '+me.role;return me.mustChangePassword?changePassword(true):dashboard();}catch{return login()}}catch(e){app.innerHTML='<section class="card narrow"><h2>Setup issue</h2>'+msg(e.message,true)+'<p class="muted">Check that the D1 database migration has been applied.</p></section>'}}
function setup(){app.innerHTML='<section class="card narrow"><h2>First-time setup</h2><p class="muted">Create your initial admin and default employee account. Passwords must be at least 12 characters and will be stored as hashes.</p><form id="setupForm"><h3>Admin account</h3>'+formInput('Full name','adminName')+formInput('Employee ID','adminId','text','value="ADMIN-001"')+formInput('Username','adminUser')+formInput('Password (12+ characters)','adminPass','password','minlength="12"')+'<h3>Default employee account</h3>'+formInput('Full name','empName')+formInput('Employee ID','empId','text','value="EMP-001"')+formInput('Username','empUser')+formInput('Password (12+ characters)','empPass','password','minlength="12"')+'<button class="primary">Create initial accounts</button><div id="formMessage"></div></form></section>';document.getElementById('setupForm').onsubmit=async e=>{e.preventDefault();const f=new FormData(e.target);try{await post('/api/setup',{admin:{name:f.get('adminName'),employeeId:f.get('adminId'),username:f.get('adminUser'),password:f.get('adminPass')},employee:{name:f.get('empName'),employeeId:f.get('empId'),username:f.get('empUser'),password:f.get('empPass')}});login('Initial accounts created. Sign in and change your password.')}catch(x){document.getElementById('formMessage').innerHTML=msg(x.message,true)}}}
function login(note=''){app.innerHTML='<section class="card narrow"><h2>Sign in</h2><p class="muted">Use the username and password configured by your admin.</p>'+(note?msg(note):'')+'<form id="loginForm">'+formInput('Username','username')+formInput('Password','password','password')+'<button class="primary">Sign in</button><div id="formMessage"></div></form></section>';document.getElementById('loginForm').onsubmit=async e=>{e.preventDefault();const f=new FormData(e.target);try{const r=await post('/api/login',{username:f.get('username'),password:f.get('password')});me=r.user;document.getElementById('who').textContent=me.name+' · '+me.role;me.mustChangePassword?changePassword(true):dashboard()}catch(x){document.getElementById('formMessage').innerHTML=msg(x.message,true)}}}
function changePassword(first=false){app.innerHTML='<section class="card narrow"><h2>Change password</h2><p class="muted">'+(first?'You must change the initial password before continuing.':'Use a new password of at least 12 characters.')+'</p><form id="pwForm">'+formInput('Current password','currentPassword','password')+formInput('New password (12+ characters)','newPassword','password','minlength="12"')+formInput('Confirm new password','confirmPassword','password','minlength="12"')+'<button class="primary">Update password</button><div id="formMessage"></div></form><div class="actions"><button id="logout" class="secondary">Sign out</button></div></section>';document.getElementById('logout').onclick=logout;document.getElementById('pwForm').onsubmit=async e=>{e.preventDefault();const f=new FormData(e.target);if(f.get('newPassword')!==f.get('confirmPassword')){document.getElementById('formMessage').innerHTML=msg('Passwords do not match.',true);return}try{await post('/api/change-password',{currentPassword:f.get('currentPassword'),newPassword:f.get('newPassword')});me.mustChangePassword=false;dashboard()}catch(x){document.getElementById('formMessage').innerHTML=msg(x.message,true)}}}
async function logout(){try{await post('/api/logout',{})}catch{}me=null;document.getElementById('who').textContent='';login('You have signed out.')}
async function dashboard(){app.innerHTML='<div class="card"><div class="actions" style="justify-content:space-between"><div><h2>Attendance dashboard</h2><p class="muted">Create records and update daily accomplishments without changing original timestamps.</p></div><button id="logout" class="secondary">Sign out</button></div><div class="stats"><div class="stat"><strong id="statDays">—</strong><span class="muted">Attendance days</span></div><div class="stat"><strong id="statOpen">—</strong><span class="muted">Open sessions</span></div><div class="stat"><strong id="statRole">'+esc(me.role)+'</strong><span class="muted">Your role</span></div></div></div><div class="tabs"><button class="secondary active" data-tab="attendance">Attendance</button>'+(me.role==='admin'?'<button class="secondary" data-tab="users">Employee accounts</button><button class="secondary" data-tab="reports">Reports</button>':'')+'<button class="secondary" data-tab="password">Change password</button></div><div id="panel"></div>';document.getElementById('logout').onclick=logout;document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>showTab(b.dataset.tab));await showTab('attendance')}
async function showTab(tab){document.querySelectorAll('[data-tab]').forEach(b=>b.classList.toggle('active',b.dataset.tab===tab));const panel=document.getElementById('panel');if(tab==='password')return changePassword(false);if(tab==='attendance'){try{const r=await api('/api/attendance'+(me.role==='admin'?'?all=1':''));records=r.records;document.getElementById('statDays').textContent=records.length;document.getElementById('statOpen').textContent=records.filter(r=>!r.check_out).length;panel.innerHTML='<section class="card"><h3>Check in / create attendance</h3><form id="createForm" class="grid"><label>Attendance date<input type="date" name="date" value="'+today()+'" required></label><label>Daily accomplishment / remarks<textarea name="accomplishment" placeholder="What did you work on today?"></textarea></label><div><button class="primary">Create attendance</button></div></form><div class="notice">Check-in and check-out times are server-generated. Editing remarks cannot alter timestamps. Each employee can create one record per date.</div></section><section class="card"><h3>'+(me.role==='admin'?'All employees':'My')+' attendance records</h3><div class="tablewrap"><table><thead><tr>'+(me.role==='admin'?'<th>Employee</th>':'')+'<th>Date</th><th>Check-in</th><th>Check-out</th><th>Daily accomplishment / remarks</th><th>Actions</th></tr></thead><tbody>'+records.map(r=>'<tr>'+(me.role==='admin'?'<td>'+esc(r.employee_name)+'<br><span class="muted">'+esc(r.employee_id)+'</span></td>':'')+'<td>'+esc(r.attendance_date)+'</td><td>'+esc(new Date(r.check_in).toLocaleString())+'</td><td>'+esc(r.check_out?new Date(r.check_out).toLocaleString():'In progress')+'</td><td><textarea id="ac-'+r.id+'">'+esc(r.accomplishment)+'</textarea></td><td><div class="actions"><button class="primary" data-save="'+r.id+'">Save remarks</button>'+(r.user_id===me.id&&!r.check_out?'<button class="secondary" data-out="'+r.id+'">Check out</button>':'')+(me.role==='admin'?'<button class="danger" data-delete="'+r.id+'">Delete</button>':'')+'</div></td></tr>').join('')+'</tbody></table></div>'+(records.length?'':'<p class="muted">No attendance records yet.</p>')+'</section>';document.getElementById('createForm').onsubmit=async e=>{e.preventDefault();const f=new FormData(e.target);try{await post('/api/attendance',{date:f.get('date'),accomplishment:f.get('accomplishment')});await showTab('attendance')}catch(x){alert(x.message)}};panel.querySelectorAll('[data-save]').forEach(b=>b.onclick=async()=>{try{await api('/api/attendance/'+b.dataset.save,{method:'PATCH',body:JSON.stringify({accomplishment:document.getElementById('ac-'+b.dataset.save).value})});alert('Daily accomplishment updated. Timestamps unchanged.')}catch(x){alert(x.message)}});panel.querySelectorAll('[data-out]').forEach(b=>b.onclick=async()=>{try{await post('/api/attendance/'+b.dataset.out+'?action=checkout',{});await showTab('attendance')}catch(x){alert(x.message)}});panel.querySelectorAll('[data-delete]').forEach(b=>b.onclick=async()=>{if(!confirm('Permanently delete this attendance record?'))return;try{await api('/api/attendance/'+b.dataset.delete,{method:'DELETE'});await showTab('attendance')}catch(x){alert(x.message)}})}catch(x){panel.innerHTML=msg(x.message,true)}return}
if(tab==='users'){try{const r=await api('/api/users');users=r.users;panel.innerHTML='<section class="card"><h3>Create employee/admin account</h3><form id="userForm" class="grid">'+formInput('Full name','name')+formInput('Employee ID','employeeId')+formInput('Username','username')+formInput('Temporary password (12+ characters)','password','password','minlength="12"')+'<label>Role<select name="role"><option value="employee">Employee</option><option value="admin">Admin</option></select></label><div><button class="primary">Create account</button></div></form></section><section class="card"><h3>Manage accounts</h3><div class="tablewrap"><table><thead><tr><th>Employee ID</th><th>Name</th><th>Username</th><th>Role</th><th>Status</th><th>Actions</th></tr></thead><tbody>'+users.map(u=>'<tr><td>'+esc(u.employee_id)+'</td><td>'+esc(u.name)+'</td><td>'+esc(u.username)+'</td><td><select id="role-'+u.id+'"><option value="employee" '+(u.role==='employee'?'selected':'')+'>Employee</option><option value="admin" '+(u.role==='admin'?'selected':'')+'>Admin</option></select></td><td><select id="active-'+u.id+'"><option value="1" '+(u.active?'selected':'')+'>Active</option><option value="0" '+(!u.active?'selected':'')+'>Inactive</option></select></td><td><button class="primary" data-user-save="'+u.id+'">Save</button></td></tr>').join('')+'</tbody></table></div></section>';document.getElementById('userForm').onsubmit=async e=>{e.preventDefault();const f=new FormData(e.target);try{await post('/api/users',Object.fromEntries(f));await showTab('users')}catch(x){alert(x.message)}};panel.querySelectorAll('[data-user-save]').forEach(b=>b.onclick=async()=>{const id=b.dataset.userSave;try{await api('/api/users/'+id,{method:'PATCH',body:JSON.stringify({name:users.find(u=>u.id==id).name,role:document.getElementById('role-'+id).value,active:document.getElementById('active-'+id).value==='1'})});await showTab('users')}catch(x){alert(x.message)}})}catch(x){panel.innerHTML=msg(x.message,true)}return}
if(tab==='reports'){try{const r=await api('/api/reports');reports=r.reports;panel.innerHTML='<section class="card"><h3>Attendance summary by employee</h3><div class="tablewrap"><table><thead><tr><th>Employee ID</th><th>Name</th><th>Attendance days</th><th>Completed hours</th></tr></thead><tbody>'+reports.map(r=>'<tr><td>'+esc(r.employee_id)+'</td><td>'+esc(r.name)+'</td><td>'+esc(r.days)+'</td><td>'+esc(r.hours||0)+'</td></tr>').join('')+'</tbody></table></div><button id="csv" class="secondary">Export attendance CSV</button></section>';document.getElementById('csv').onclick=async()=>{const all=await api('/api/attendance?all=1');const rows=[['Employee ID','Employee','Date','Check in','Check out','Daily accomplishment','Created at'],...all.records.map(r=>[r.employee_id,r.employee_name,r.attendance_date,r.check_in,r.check_out||'',r.accomplishment,r.created_at])];const csv=rows.map(row=>row.map(v=>'"'+String(v??'').replace(/"/g,'""')+'"').join(',')).join('\r\n');const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv'}));a.download='wfh-attendance.csv';a.click();URL.revokeObjectURL(a.href)}}catch(x){panel.innerHTML=msg(x.message,true)}}
}
boot();
</script></body></html>
